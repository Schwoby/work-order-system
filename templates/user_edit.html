<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Profile</title>
  <link rel="icon" href="{{ url_for('static', filename='5411012-512-BW.png') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{{ current_theme or 'light' }}">
<h1>User Profile</h1>

<p>Status: {{ status_text }}</p>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flash">
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form method="post">
  <h2>Login Details</h2>
  <label>User Name:<br>
    <input type="email" name="user_id" value="{{ current_user['user_id'] }}" required autocomplete="username" readonly>
  </label>

  <label>New Password (leave blank to keep current):<br>
    <input type="password" name="password" autocomplete="new-password">
  </label>

  <label>Verify New Password:<br>
    <input type="password" name="verify_password" autocomplete="new-password">
  </label>

  <h2>Profile Details</h2>
  <label>Full Name:<br>
    <input type="text" name="full_name" value="{{ prefs['full_name'] if prefs else '' }}" required>
  </label>

  <label>Display Name:<br>
    <input type="text" name="display_name" value="{{ prefs['display_name'] if prefs else '' }}" required>
  </label>

  <label>Timezone:<br>
    <select name="timezone" required>
      <option value="">-- Select Timezone --</option>
      {% for tz in timezones %}
        <option value="{{ tz }}" {% if prefs and prefs['timezone'] == tz %}selected{% endif %}>{{ tz }}</option>
      {% endfor %}
    </select>
  </label>

  <fieldset>
    <legend>Theme</legend>
    <label>
      <input type="radio" name="theme" value="light" {% if prefs and prefs['theme'] == 'light' %}checked{% endif %} required>
      Light
    </label>
    <label>
      <input type="radio" name="theme" value="dark" {% if prefs and prefs['theme'] == 'dark' %}checked{% endif %}>
      Dark
    </label>
  </fieldset>

  <fieldset>
    <legend>Default View</legend>
    <label>
      <input type="radio" name="default_view" value="option1" {% if prefs and prefs['default_view'] == 'option1' %}checked{% endif %} required>
      Open Work Orders
    </label>
    <label>
      <input type="radio" name="default_view" value="option2" {% if prefs and prefs['default_view'] == 'option2' %}checked{% endif %}>
      Create Work Order
    </label>
    <label>
      <input type="radio" name="default_view" value="option3" {% if prefs and prefs['default_view'] == 'option3' %}checked{% endif %}>
      Completed Work Orders
    </label>
  </fieldset>

  <fieldset>
    <legend>Name View</legend>
    <label>
      <input type="radio" name="name_view" value="user_id" {% if prefs and prefs['name_view'] == 'user_id' %}checked{% endif %} required>
      User ID
    </label>
    <label>
      <input type="radio" name="name_view" value="user_name" {% if prefs and prefs['name_view'] == 'user_name' %}checked{% endif %}>
      User Name
    </label>
    <label>
      <input type="radio" name="name_view" value="display_name" {% if prefs and prefs['name_view'] == 'display_name' %}checked{% endif %}>
      Display Name
    </label>
  </fieldset>

  <button type="submit">Update Changes</button>
</form>

{% include "_nav.html" %}

<h4></h4>
</body>
</html>
