<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Login</title>
  <link rel="icon" href="{{ url_for('static', filename='5411012-512-BW.png') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h1>User Login</h1>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flash">
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form method="post">
  <label>Email Address:<br>
    <input type="email" name="user_id" required autocomplete="username">
  </label>

  <label>Password:<br>
    <input type="password" name="password" required autocomplete="current-password">
  </label>

  <button type="submit">Login</button>
</form>

<p><a href="{{ url_for('user_create') }}">Create User</a></p>

<h4></h4>
</body>
</html>
